    "Chittagong H.T.": Chittagong Hill Tracts
    "Chittagonj H.T": Chittagong Hill Tracts
    Barissal: Barisal
    Chittagonj: Chittagong
    "Cox' Bazar": Cox's Bazar
    Gaibandha: Gaibanda
