# Per-country pipeline configuration.
#
# To add a new country, copy one block, change the two-letter code,
# and fill in the four required sections:
#
#   name            - human-readable country name (used in plot titles)
#   bbox            - [lon_min, lat_min, lon_max, lat_max] for GOSIF clip
#                     add ~1 degree buffer beyond the admin boundary extent
#   stablebound_dir - path to the country folder inside your stablebound
#                     checkout, relative to the project root
#   raw_csv         - path to the raw FEWS CSV (the one you give to stablebound),
#                     relative to the project root
#   base_year       - stablebound lineage base year (the coarsest partition,
#                     valid for the entire analysis window). Confirmed by
#                     matching n_stable_groups_at_base in stats_aggregated.csv.
#   crop_map        - FEWS crop slug (variable prefix in stats_aggregated.csv)
#                     -> CROPGRIDs filename stem (file: data/raw/cropgrids/CROPGRIDSv1.08_<stem>.nc)
#                     Multiple FEWS slugs may map to the same CROPGRIDs stem
#                     (e.g. "soybean" and "soybean_unspecified" both -> "soybean").
#   area_measures   - OPTIONAL. Which stats_aggregated variables carry area,
#                     in priority order, as [variable_suffix, area_type].
#                     Omit for FEWS-sourced countries, which report harvested
#                     and planted separately and default to
#                     [[area_harvested_ha, harvested], [area_planted_ha, planted]].
#                     India's DESAGRI export reports a single planted `area_ha`.
#   admin_name_aliases - raw CSV admin names that differ from the lineage spellings
#                     that stablebound used when building name_history.csv.
#                     Key: name as it appears in the raw FEWS CSV.
#                     Value: name as it appears in name_history.csv.
#                     Required when official renamings post-date the lineage build
#                     (e.g. Bangladesh's 2018 district renames).
#                     Omit entirely if no mismatches exist.

TH:
  name: Thailand
  bbox: [96.0, 4.0, 107.0, 22.0]
  stablebound_dir: stablebound_starter/stablebound_TH_BD_VN_starter/thailand
  raw_csv: stablebound_starter/stablebound_TH_BD_VN_starter/thailand/th_standard_apr2926_forjonah.csv
  base_year: 1978
  crop_map:
    rice: rice
    soybeans: soybean
  admin_name_aliases:
    Bangkok: Bangkok Metropolis
    Phra Nakhon Si Ayutthaya: Ayutthaya
    Nong Bua Lamphu: Nong Bua Lam Phu
    Phang Nga: Phangnga

